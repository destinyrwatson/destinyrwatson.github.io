<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact | Destiny Watson</title>
    
    <!-- Custom font used here -->

    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="nav.css">
</head>

<body>

<header>
    <img src="logo.png" alt="Logo">

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="reflection.html">Reflection</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="section">
    <h2>Contact Me</h2>

    <form>

        <!-- Title -->
        <label for="title">Title:</label>
        <select id="title" name="title" required>
            <option value="" disabled selected>Select your title</option>
            <option value="mr">Mr.</option>
            <option value="ms1">Miss.</option>
            <option value="ms2">Ms.</option>
            <option value="mrs">Mrs.</option>
            <option value="dr">Dr.</option>
        </select>

        <!-- Full Name -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <!-- Email -->
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <!-- Topic -->
        <label for="topic">Select Topic:</label>
        <select id="topic" name="topic" required>
            <option value="" disabled selected>Select a topic</option>
            <option value="projects">Projects</option>
            <option value="career">Career</option>
            <option value="general">General Question</option>
        </select>

        <!-- Message -->
        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Write your message here" rows="5" required></textarea>

        <!-- Submit -->
        <button type="submit">Submit</button>

    </form>
</section>

<!-- Footer -->
<footer>
    <p>
        <img src="phone.png" class="icon" alt="Phone icon">
        (573) 819-0192
    </p>

    <p>
        <img src="email.png" class="icon" alt="Email icon">
        destinywatson06@gmail.com
    </p>

    <p>
        © 2026 Destiny Watson
    </p>
</footer>

</body>
</html>
